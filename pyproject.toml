[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-custom-search-api"
version = "2.0.0"
description = "A standalone Google web search client and service, no API key and no search engine id."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "lxml>=5.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.45",
]
camoufox = [
    "playwright>=1.45",
    "camoufox>=0.5",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
google-custom-search = "google_custom_search.cli:main"

[tool.setuptools]
packages = ["google_custom_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
